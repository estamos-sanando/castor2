<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 140" width="100" height="140">
  <defs>
    <linearGradient id="wTrunk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a8a8a"/><stop offset="100%" stop-color="#2c3a3a"/>
    </linearGradient>
  </defs>
  <!-- Standing dead trunk in water — roots below waterline -->
  <ellipse cx="50" cy="128" rx="28" ry="8" fill="rgba(60,100,120,0.5)"/>
  <!-- Water surface ripples around base -->
  <ellipse cx="50" cy="120" rx="22" ry="5" fill="none" stroke="rgba(100,180,220,0.5)" stroke-width="1.5"/>
  <ellipse cx="50" cy="120" rx="32" ry="7" fill="none" stroke="rgba(100,180,220,0.3)" stroke-width="1"/>
  <!-- Submerged trunk base -->
  <rect x="45" y="110" width="10" height="20" fill="#3a4a4a" opacity="0.7" rx="2"/>
  <!-- Main grey trunk -->
  <path d="M45,120 L47,40 L53,40 L55,120 Z" fill="url(#wTrunk)"/>
  <!-- Sparse dead branches (fewer than full dead tree) -->
  <path d="M50,95 Q30,80 20,68" stroke="#607070" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M50,80 Q72,66 82,54" stroke="#607070" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M50,65 Q44,44 38,32" stroke="#607070" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Algae / slime at waterline -->
  <ellipse cx="48" cy="119" rx="8" ry="2" fill="#4a6a3a" opacity="0.7"/>
  <ellipse cx="54" cy="121" rx="5" ry="1.5" fill="#3a5a2a" opacity="0.7"/>
</svg>
