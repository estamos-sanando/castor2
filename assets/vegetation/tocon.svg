<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="freshCut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d6a7"/>
      <stop offset="100%" stop-color="#d7ccc8"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Sombra del tocón -->
    <ellipse cx="40" cy="72" rx="25" ry="8" fill="rgba(0,0,0,0.35)"/>

    <!-- Base de corteza -->
    <path d="M 22,70 L 26,45 L 54,45 L 58,70 Z" fill="url(#bark)" stroke="#271c19" stroke-width="1.5"/>

    <!-- Punta cónica estilo lápiz por dientes de castor -->
    <polygon points="26,45 40,22 54,45" fill="url(#freshCut)" stroke="#8d6e63" stroke-width="1"/>

    <!-- Anillos de crecimiento del árbol -->
    <ellipse cx="40" cy="45" rx="14" ry="4" fill="#e0c097" stroke="#8d6e63" stroke-width="1"/>
    <ellipse cx="40" cy="45" rx="8" ry="2.5" fill="none" stroke="#a1887f" stroke-width="0.8"/>
    <ellipse cx="40" cy="45" rx="3" ry="1" fill="none" stroke="#8d6e63" stroke-width="0.8"/>

    <!-- Virutas en la base -->
    <ellipse cx="20" cy="68" rx="3" ry="1.5" fill="#f5d6a7"/>
    <ellipse cx="60" cy="70" rx="4" ry="2" fill="#f5d6a7"/>
    <ellipse cx="34" cy="73" rx="3.5" ry="1.8" fill="#f5d6a7"/>
  </g>
</svg>
