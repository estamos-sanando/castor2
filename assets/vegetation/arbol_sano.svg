<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 180" width="140" height="180">
  <defs>
    <linearGradient id="lengaTrunk" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a301a"/>
      <stop offset="50%" stop-color="#734d2c"/>
      <stop offset="100%" stop-color="#2d1c0e"/>
    </linearGradient>
    <radialGradient id="lengaFoliage" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#558b2f"/>
      <stop offset="50%" stop-color="#33691e"/>
      <stop offset="100%" stop-color="#1b4d0e"/>
    </radialGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Sombra proyectada en diagonal 45° -->
    <ellipse cx="60" cy="155" rx="45" ry="14" fill="rgba(0,0,0,0.3)"/>

    <!-- Tronco robusto de Lenga -->
    <path d="M 52,158 L 56,80 L 64,80 L 68,158 Z" fill="url(#lengaTrunk)"/>
    <!-- Raíces expuestas -->
    <path d="M 52,158 Q 42,162 35,164 M 68,158 Q 78,162 85,165" stroke="#2d1c0e" stroke-width="4" stroke-linecap="round"/>

    <!-- Copa Nivel 3 (Fondo) -->
    <ellipse cx="60" cy="70" rx="42" ry="32" fill="#1b4d0e"/>

    <!-- Copa Nivel 2 (Medio) -->
    <ellipse cx="56" cy="62" rx="38" ry="28" fill="url(#lengaFoliage)"/>
    <ellipse cx="70" cy="55" rx="28" ry="22" fill="#33691e"/>

    <!-- Copa Nivel 1 (Superior / Cúspide) -->
    <ellipse cx="58" cy="38" rx="28" ry="22" fill="url(#lengaFoliage)"/>
    <ellipse cx="62" cy="24" rx="16" ry="14" fill="#689f38"/>

    <!-- Textura y brillos de hoja -->
    <circle cx="45" cy="45" r="4" fill="#8bc34a" opacity="0.6"/>
    <circle cx="72" cy="35" r="5" fill="#8bc34a" opacity="0.6"/>
  </g>
</svg>
