<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 180" width="140" height="180">
  <defs>
    <linearGradient id="deadWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#95a5a6"/>
      <stop offset="50%" stop-color="#7f8c8d"/>
      <stop offset="100%" stop-color="#34495e"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 10)">
    <!-- Sombra tenue -->
    <ellipse cx="60" cy="155" rx="35" ry="10" fill="rgba(0,0,0,0.2)"/>

    <!-- Tronco descompuesto gris fantasma -->
    <path d="M 54,155 L 57,70 L 63,70 L 66,155 Z" fill="url(#deadWood)" stroke="#2c3e50" stroke-width="1.5"/>

    <!-- Ramas secas desnudas sin hojas -->
    <path d="M 58,110 Q 30,95 20,80 M 20,80 L 15,70 M 20,80 L 28,72" stroke="url(#deadWood)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 60,90 Q 90,75 105,60 M 105,60 L 115,50 M 105,60 L 98,50" stroke="url(#deadWood)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 59,70 L 52,40 M 52,40 L 42,28 M 52,40 L 60,30" stroke="url(#deadWood)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Marcas de deterioro y fisuras -->
    <line x1="57" y1="120" x2="63" y2="140" stroke="#2c3e50" stroke-width="1"/>
    <line x1="59" y1="80" x2="61" y2="100" stroke="#2c3e50" stroke-width="1"/>
  </g>
</svg>
