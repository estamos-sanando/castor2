<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <defs>
    <linearGradient id="dockWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6030"/><stop offset="100%" stop-color="#4a3010"/>
    </linearGradient>
    <linearGradient id="waterG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a8ab0"/><stop offset="100%" stop-color="#1a5a80"/>
    </linearGradient>
  </defs>
  <!-- Water base -->
  <path d="M0,54 Q30,50 60,54 Q90,58 120,54 L120,80 L0,80 Z" fill="url(#waterG)" opacity="0.85"/>
  <!-- Ripples -->
  <ellipse cx="60" cy="56" rx="30" ry="4" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <ellipse cx="60" cy="56" rx="50" ry="6" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Dock planks (isometric top view) -->
  <polygon points="10,46 110,46 115,54 5,54" fill="url(#dockWood)" stroke="#3a2010" stroke-width="1.5"/>
  <!-- Plank lines -->
  <line x1="30" y1="46" x2="32" y2="54" stroke="#3a2010" stroke-width="1"/>
  <line x1="50" y1="46" x2="52" y2="54" stroke="#3a2010" stroke-width="1"/>
  <line x1="70" y1="46" x2="72" y2="54" stroke="#3a2010" stroke-width="1"/>
  <line x1="90" y1="46" x2="92" y2="54" stroke="#3a2010" stroke-width="1"/>
  <!-- Support pylons -->
  <rect x="15" y="50" width="5" height="24" fill="#3a2010" rx="1"/>
  <rect x="52" y="50" width="5" height="24" fill="#3a2010" rx="1"/>
  <rect x="89" y="50" width="5" height="24" fill="#3a2010" rx="1"/>
  <!-- Rope -->
  <path d="M25,48 Q35,42 45,44" stroke="#c49a50" stroke-width="1.5" fill="none"/>
  <!-- Mooring post -->
  <circle cx="20" cy="45" r="4" fill="#5a3818" stroke="#3a2010" stroke-width="1"/>
</svg>
