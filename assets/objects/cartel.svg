<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 110" width="80" height="110">
  <defs>
    <linearGradient id="postGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6030"/><stop offset="100%" stop-color="#4a3010"/>
    </linearGradient>
  </defs>
  <!-- Post shadow -->
  <ellipse cx="26" cy="100" rx="10" ry="4" fill="rgba(0,0,0,0.35)"/>
  <!-- Wooden post -->
  <rect x="22" y="48" width="8" height="54" fill="url(#postGrad)" rx="2"/>
  <rect x="20" y="96" width="12" height="6" fill="#3a2010" rx="1"/>
  <!-- Sign board (green Parques Nacionales style) -->
  <rect x="8" y="14" width="64" height="40" fill="#1a4a18" rx="4" stroke="#0e2e10" stroke-width="2"/>
  <!-- Inner frame -->
  <rect x="11" y="17" width="58" height="34" fill="none" stroke="#2a6a20" stroke-width="1.5" rx="2"/>
  <!-- Logo: paw print / castor icon placeholder -->
  <circle cx="24" cy="28" r="6" fill="#4a9a40" opacity="0.8"/>
  <path d="M24,25 Q27,28 24,31" stroke="#fff" stroke-width="1.5" fill="none" opacity="0.9"/>
  <!-- Text lines (white on green) -->
  <rect x="34" y="20" width="30" height="4" fill="white" rx="1" opacity="0.9"/>
  <rect x="34" y="27" width="24" height="3" fill="white" rx="1" opacity="0.7"/>
  <rect x="34" y="33" width="28" height="3" fill="white" rx="1" opacity="0.7"/>
  <rect x="34" y="39" width="20" height="3" fill="white" rx="1" opacity="0.6"/>
  <!-- Yellow warning triangle at top -->
  <polygon points="58,8 66,20 50,20" fill="#f1c40f" stroke="#e0a000" stroke-width="1"/>
  <text x="58" y="17" text-anchor="middle" font-size="8" font-weight="bold" fill="#1a0a00">!</text>
</svg>
