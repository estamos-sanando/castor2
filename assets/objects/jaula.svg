<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80">
  <defs>
    <linearGradient id="cageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#888"/><stop offset="100%" stop-color="#444"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="50" cy="74" rx="38" ry="8" fill="rgba(0,0,0,0.3)"/>
  <!-- Cage frame base -->
  <rect x="12" y="28" width="76" height="44" fill="#b0b8b0" rx="4" stroke="#555" stroke-width="2"/>
  <!-- Inside darker -->
  <rect x="14" y="30" width="72" height="40" fill="#1e2820" rx="3"/>
  <!-- Wire grid lines horizontal -->
  <line x1="12" y1="38" x2="88" y2="38" stroke="#888" stroke-width="1.2"/>
  <line x1="12" y1="48" x2="88" y2="48" stroke="#888" stroke-width="1.2"/>
  <line x1="12" y1="58" x2="88" y2="58" stroke="#888" stroke-width="1.2"/>
  <line x1="12" y1="68" x2="88" y2="68" stroke="#888" stroke-width="1.2"/>
  <!-- Wire grid lines vertical -->
  <line x1="24" y1="28" x2="24" y2="72" stroke="#888" stroke-width="1.2"/>
  <line x1="36" y1="28" x2="36" y2="72" stroke="#888" stroke-width="1.2"/>
  <line x1="48" y1="28" x2="48" y2="72" stroke="#888" stroke-width="1.2"/>
  <line x1="60" y1="28" x2="60" y2="72" stroke="#888" stroke-width="1.2"/>
  <line x1="72" y1="28" x2="72" y2="72" stroke="#888" stroke-width="1.2"/>
  <!-- Trap door mechanism (right side, open) -->
  <rect x="72" y="18" width="16" height="24" fill="#999" rx="2" stroke="#555" stroke-width="1.5"/>
  <line x1="80" y1="18" x2="80" y2="42" stroke="#777" stroke-width="1"/>
  <circle cx="80" cy="16" r="3" fill="#aaa" stroke="#555"/>
  <!-- Bait: twigs inside -->
  <line x1="22" y1="66" x2="46" y2="54" stroke="#8a5a2a" stroke-width="2" stroke-linecap="round"/>
  <line x1="26" y1="70" x2="44" y2="60" stroke="#a07040" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Beaver silhouette trapped inside -->
  <ellipse cx="55" cy="58" rx="10" ry="7" fill="#7a4520" opacity="0.8"/>
  <circle cx="63" cy="52" r="6" fill="#7a4520" opacity="0.8"/>
  <ellipse cx="46" cy="62" rx="6" ry="3" fill="#3a2010" opacity="0.7" transform="rotate(-20 46 62)"/>
  <circle cx="65" cy="50" r="1.2" fill="#fff"/>
  <!-- Cage label -->
  <rect x="16" y="30" width="20" height="10" fill="#f1c40f" rx="2"/>
  <text x="26" y="38" text-anchor="middle" font-size="7" font-weight="bold" fill="#1a0a00">TRAP</text>
</svg>
