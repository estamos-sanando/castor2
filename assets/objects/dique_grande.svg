<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <defs>
    <linearGradient id="damWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="mud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#271c19"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Sombra del dique -->
    <ellipse cx="70" cy="78" rx="65" ry="14" fill="rgba(0,0,0,0.4)"/>

    <!-- Barro de estancamiento acumulado -->
    <path d="M 10,75 C 30,60 110,60 135,75 C 110,88 30,88 10,75 Z" fill="url(#mud)"/>

    <!-- Red de palos y troncos entramados en diagonal -->
    <!-- Troncos principales -->
    <rect x="25" y="45" width="45" height="8" rx="3" fill="url(#damWood)" transform="rotate(-15 25 45)" stroke="#271c19"/>
    <rect x="55" y="40" width="55" height="9" rx="3" fill="url(#damWood)" transform="rotate(10 55 40)" stroke="#271c19"/>
    <rect x="35" y="55" width="60" height="10" rx="3" fill="url(#damWood)" transform="rotate(-5 35 55)" stroke="#271c19"/>
    <rect x="75" y="50" width="40" height="7" rx="3" fill="url(#damWood)" transform="rotate(-25 75 50)" stroke="#271c19"/>

    <!-- Ramas finas entramadas -->
    <line x1="20" y1="65" x2="60" y2="40" stroke="#a1887f" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="75" x2="80" y2="45" stroke="#8d6e63" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="70" y1="70" x2="120" y2="50" stroke="#a1887f" stroke-width="3" stroke-linecap="round"/>
    <line x1="90" y1="75" x2="130" y2="60" stroke="#795548" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Pequeño rebalse de agua filtrada -->
    <path d="M 65,68 Q 70,78 72,85 M 95,65 Q 98,75 100,82" stroke="#4fc3f7" stroke-width="2" fill="none" opacity="0.8"/>
  </g>
</svg>
