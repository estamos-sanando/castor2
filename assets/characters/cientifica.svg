<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130">
  <defs>
    <linearGradient id="sciJacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1c40f"/>
      <stop offset="100%" stop-color="#b7950b"/>
    </linearGradient>
    <linearGradient id="sciPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a252f"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Sombra -->
    <ellipse cx="40" cy="118" rx="20" ry="7" fill="rgba(0,0,0,0.35)"/>

    <!-- Botas de goma acuáticas -->
    <rect x="28" y="98" width="10" height="18" rx="3" fill="#1a252f"/>
    <rect x="42" y="98" width="10" height="18" rx="3" fill="#1a252f"/>

    <!-- Pantalones -->
    <rect x="27" y="65" width="11" height="36" fill="url(#sciPants)"/>
    <rect x="42" y="65" width="11" height="36" fill="url(#sciPants)"/>

    <!-- Anorak / Campera técnica de campo brillante -->
    <path d="M 20,35 L 60,35 L 63,68 L 17,68 Z" fill="url(#sciJacket)" stroke="#7d6608" stroke-width="1.5"/>

    <!-- Libreta de notas / Clipboard de monitoreo ecológico -->
    <rect x="46" y="42" width="16" height="22" rx="2" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
    <rect x="49" y="46" width="10" height="2" fill="#3498db"/>
    <rect x="49" y="50" width="8" height="2" fill="#7f8c8d"/>
    <rect x="49" y="54" width="11" height="2" fill="#7f8c8d"/>

    <!-- Brazos sosteniendo libreta -->
    <rect x="13" y="38" width="8" height="22" rx="4" fill="url(#sciJacket)"/>
    <rect x="58" y="38" width="8" height="20" rx="4" fill="url(#sciJacket)"/>

    <!-- Cabeza y Cabello -->
    <circle cx="40" cy="22" r="10" fill="#f5cba7"/>
    <!-- Cabello castaño recogido -->
    <path d="M 29,20 C 29,10 51,10 51,20 C 51,12 40,8 29,20 Z" fill="#512e10"/>
    <circle cx="51" cy="21" r="4" fill="#512e10"/> <!-- Rodete / coleta -->

    <!-- Lentes de protección / Monitoreo -->
    <rect x="33" y="19" width="6" height="4" rx="1" fill="none" stroke="#2980b9" stroke-width="1.2"/>
    <rect x="41" y="19" width="6" height="4" rx="1" fill="none" stroke="#2980b9" stroke-width="1.2"/>
    <line x1="39" y1="21" x2="41" y2="21" stroke="#2980b9"/>
  </g>
</svg>
