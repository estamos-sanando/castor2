<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Gradientes para pelaje de castor e iluminación isométrica 45° -->
    <linearGradient id="beaverFur" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a532b"/>
      <stop offset="50%" stop-color="#673919"/>
      <stop offset="100%" stop-color="#3d200c"/>
    </linearGradient>
    <linearGradient id="beaverBelly" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a46d42"/>
      <stop offset="100%" stop-color="#673919"/>
    </linearGradient>
    <linearGradient id="beaverTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#382d26"/>
      <stop offset="100%" stop-color="#191310"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="5" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Sombra proyectada en el suelo isométrico -->
    <ellipse cx="60" cy="102" rx="35" ry="12" fill="rgba(0,0,0,0.35)"/>

    <!-- Cola de paleta escamada -->
    <path d="M 30,85 C 10,88 5,75 18,70 C 28,68 40,75 42,82 Z" fill="url(#beaverTail)" stroke="#191310" stroke-width="1.5"/>
    <!-- Escamas en la cola -->
    <path d="M 16,74 Q 22,76 28,73 M 14,78 Q 22,80 32,77 M 20,83 Q 26,85 34,81" stroke="#4a3b32" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Cuerpo isométrico (Castor) -->
    <ellipse cx="62" cy="78" rx="26" ry="20" fill="url(#beaverFur)" transform="rotate(-10 62 78)" stroke="#2b1507" stroke-width="2"/>
    <!-- Pecho / Vientre -->
    <ellipse cx="68" cy="80" rx="16" ry="12" fill="url(#beaverBelly)" opacity="0.9"/>

    <!-- Pata trasera -->
    <ellipse cx="46" cy="92" rx="10" ry="5" fill="#42220c" stroke="#2b1507"/>
    <!-- Pata delantera -->
    <ellipse cx="78" cy="90" rx="8" ry="4" fill="#42220c" stroke="#2b1507"/>

    <!-- Cabeza -->
    <circle cx="82" cy="60" r="16" fill="url(#beaverFur)" stroke="#2b1507" stroke-width="2"/>
    
    <!-- Oreja -->
    <circle cx="76" cy="48" r="4" fill="#3d200c" stroke="#2b1507"/>

    <!-- Hocico -->
    <ellipse cx="92" cy="64" rx="7" ry="5" fill="#4a2d17"/>
    <ellipse cx="95" cy="62" rx="2.5" ry="1.8" fill="#191310"/>

    <!-- Ojo brilloso -->
    <circle cx="84" cy="56" r="2.5" fill="#191310"/>
    <circle cx="85" cy="55" r="0.8" fill="#ffffff"/>

    <!-- Diente Naranja característico -->
    <rect x="94" y="68" width="3.5" height="5" fill="#ff9900" rx="0.5" stroke="#cc6600" stroke-width="0.5"/>
    <rect x="91" y="68" width="3.5" height="5" fill="#ffaa11" rx="0.5" stroke="#cc6600" stroke-width="0.5"/>
  </g>
</svg>
