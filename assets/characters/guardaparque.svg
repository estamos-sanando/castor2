<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130" width="100" height="130">
  <defs>
    <linearGradient id="rangerJacket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a6632"/>
      <stop offset="100%" stop-color="#1e3b18"/>
    </linearGradient>
    <linearGradient id="rangerPants" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c4d3c"/>
      <stop offset="100%" stop-color="#362d22"/>
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Sombra -->
    <ellipse cx="40" cy="118" rx="22" ry="8" fill="rgba(0,0,0,0.35)"/>

    <!-- Botas de campo -->
    <rect x="28" y="100" width="10" height="16" rx="3" fill="#241a13"/>
    <rect x="42" y="100" width="10" height="16" rx="3" fill="#241a13"/>

    <!-- Pantalones de combate -->
    <rect x="27" y="65" width="11" height="38" fill="url(#rangerPants)"/>
    <rect x="42" y="65" width="11" height="38" fill="url(#rangerPants)"/>

    <!-- Torso / Chaqueta Parques Nacionales -->
    <path d="M 20,35 L 60,35 L 64,68 L 16,68 Z" fill="url(#rangerJacket)" stroke="#162b12" stroke-width="1.5"/>

    <!-- Escudo oficial en la manga -->
    <polygon points="18,44 24,44 21,52" fill="#d4af37"/>

    <!-- Brazos con Prismáticos / Binoculares -->
    <rect x="12" y="38" width="9" height="24" rx="4" fill="url(#rangerJacket)"/>
    <rect x="59" y="38" width="9" height="24" rx="4" fill="url(#rangerJacket)"/>
    <!-- Binoculares colgados -->
    <rect x="33" y="46" width="14" height="10" rx="2" fill="#111" stroke="#444"/>

    <!-- Cuello y Cabeza -->
    <rect x="36" y="27" width="8" height="10" fill="#ffdbac"/>
    <circle cx="40" cy="22" r="10" fill="#ffdbac"/>

    <!-- Sombrero de Guardaparque (Estilo Ranger) -->
    <ellipse cx="40" cy="16" rx="18" ry="6" fill="#7a5229" stroke="#4a3014" stroke-width="1.5"/>
    <path d="M 28,15 Q 40,6 52,15 L 48,16 L 32,16 Z" fill="#613f1e"/>
    <rect x="31" y="14" width="18" height="3" fill="#d4af37"/>
  </g>
</svg>
